name: CSVGrade checks

on:
  push:
    paths:
      - "projects/csvgrade/**"
      - ".github/workflows/csvgrade.yml"
  pull_request:
    paths:
      - "projects/csvgrade/**"
      - ".github/workflows/csvgrade.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CSVGrade smoke tests
        working-directory: projects/csvgrade
        run: sh test_csvgrade.sh
